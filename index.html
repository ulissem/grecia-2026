<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grecia 2026">
<title>Grecia 2026 — Peloponneso classico</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><img src="./icon-192.png" alt="">Grecia 2026</div>
    <nav class="topnav" role="tablist" aria-label="Sezioni">
      <button role="tab" data-v="today" data-ui="nav_today">Oggi</button>
      <button role="tab" data-v="days" data-ui="nav_days">Itinerario</button>
      <button role="tab" data-v="map" data-ui="nav_map">Mappa</button>
      <button role="tab" data-v="guide" data-ui="nav_guide">Guida</button>
      <button role="tab" data-v="bag" data-ui="nav_bag">Valigia</button>
    </nav>
    <button class="lang" id="langBtn" type="button" aria-label="Language">EN</button>
    <div class="nowpill" id="nowpill"><span id="nowIco">·</span><b id="nowT">—</b><span id="nowP"></span></div>
  </div>
</header>

<main class="wrap">

  <!-- OGGI -->
  <section class="view" id="v-today" role="tabpanel">
    <div id="todayHero"></div>
    <div class="quick" id="quick"></div>
    <div id="todayBody"></div>
  </section>

  <!-- ITINERARIO -->
  <section class="view" id="v-days" role="tabpanel">
    <div class="chips" id="chips" role="tablist" aria-label="Giorni"></div>
    <div id="dayBody"></div>
  </section>

  <!-- MAPPA -->
  <section class="view" id="v-map" role="tabpanel">
    <div id="map" role="img" aria-label="Mappa del percorso"></div>
    <div class="legend" id="legend"></div>
    <p class="muted" style="margin-top:8px" data-ui="map_note"></p>
    <div class="btns"><a class="btn fill" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=Itea,Greece&destination=Athens+International+Airport&waypoints=Nafpaktos,Greece%7CArchaeological+Site+of+Olympia%7CNafplio,Greece%7CCorinth+Canal%7CCape+Sounion&travelmode=driving" data-ui="map_full"></a></div>
    <div class="card" style="margin-top:14px"><h3 data-ui="map_dist"></h3><table id="distTable"></table><p class="muted" style="margin-top:8px" data-ui="map_dist_note"></p></div>
  </section>

  <!-- GUIDA -->
  <section class="view" id="v-guide" role="tabpanel">
    <div class="card"><h3 data-ui="g_links"></h3><div class="hub" id="hub"></div></div>
    <div id="guideBlocks"></div>
    <div class="card"><h3 data-ui="g_sites"></h3><p class="small" id="sitesIntro"></p><table id="siteTable" style="margin-top:10px"></table><p class="muted" style="margin-top:8px" id="sitesNote"></p></div>
    <div class="grid2">
      <div class="card"><h3 data-ui="g_budget"></h3><table id="budgetTable"></table><p class="muted" style="margin-top:8px" id="budgetNote"></p></div>
      <div class="card"><h3 data-ui="g_food"></h3><ul class="small" id="foodRules"></ul><table id="foodTable" style="margin-top:8px"></table></div>
    </div>
    <div class="card"><h3 data-ui="g_phr"></h3><div class="phr" id="phr"></div></div>
    <div id="guideBlocks2"></div>
  </section>

  <!-- VALIGIA -->
  <section class="view" id="v-bag" role="tabpanel">
    <div class="card"><h3 data-ui="b_todo"></h3><p class="muted" data-ui="b_todo_sub"></p><div class="prog"><i id="progTodo"></i></div><ul class="check" id="todoList"></ul></div>
    <div class="card"><h3 data-ui="b_pack"></h3><p class="muted" data-ui="b_pack_sub"></p><div class="prog"><i id="progPack"></i></div><div id="packList"></div><div class="btns"><button class="btn sm" id="resetChk" type="button" data-ui="b_reset"></button></div></div>
  </section>

  <footer data-ui="footer"></footer>
</main>

<nav class="bottomnav" role="tablist" aria-label="Sezioni">
  <button role="tab" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-ui="nav_today">Oggi</span></button>
  <button role="tab" data-v="days"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-ui="nav_days">Itinerario</span></button>
  <button role="tab" data-v="map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-ui="nav_map">Mappa</span></button>
  <button role="tab" data-v="guide"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 012-2h12a2 2 0 012 2v14"/><path d="M4 19a2 2 0 002 2h14M8 7h8M8 11h8"/></svg><span data-ui="nav_guide">Guida</span></button>
  <button role="tab" data-v="bag"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 12h18"/></svg><span data-ui="nav_bag">Valigia</span></button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="./data.js"></script>
<script src="./data-en.js"></script>
<script src="./app.js"></script>
</body>
</html>
